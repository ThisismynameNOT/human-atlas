name: Remediate October 2026 React RSC security advisory
on:
  push:
    branches: [security/react-rsc-oct-2026]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-human-atlas-security-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.ref == 'refs/heads/security/react-rsc-oct-2026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Confirm vulnerable baseline (regression test RED)
        run: |
          node -e "const p=require('./package-lock.json');if(p.packages['node_modules/react-server-dom-webpack']?.version!=='19.2.6')process.exit(1)"
      - name: Upgrade React Server Components and sharp
        run: |
          npm install --save-exact react-server-dom-webpack@19.3.1 react@19.3.1 react-dom@19.3.1 vinext@1.3.1 shadcn@4.22.1 @vitejs/plugin-rsc@0.5.38
          npm install --save-dev --save-exact vite@8.3.5 @cloudflare/vite-plugin@1.65.0
          npm pkg set 'overrides.sharp=^0.35.5'
          npm install
      - name: Confirm patched dependencies (GREEN)
        run: |
          node - <<'NODE'
          const p=require('./package-lock.json');
          const vulnerable=[];
          for (const [k,v] of Object.entries(p.packages||{})) {
            if (/node_modules\/react-server-dom-(webpack|parcel|turbopack)$/.test(k)) {
              if (!['19.0.9','19.1.10','19.2.9','19.3.1'].includes(v.version)) vulnerable.push(k+' '+v.version);
            }
            if (/node_modules\/sharp$/.test(k) && /^0\.(3[0-4]\.|35\.[0-4]$)/.test(v.version)) vulnerable.push(k+' '+v.version);
          }
          if(vulnerable.length) throw new Error(vulnerable.join('\n'));
          console.log('React Server Components and sharp dependency guard passed');
          NODE
      - name: Clean install
        run: npm ci
      - name: TypeScript
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit only after all checks passed
        run: |
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'security: upgrade React RSC and sharp for October CVEs [skip ci]'
            git push origin HEAD:refs/heads/security/react-rsc-oct-2026
          fi
